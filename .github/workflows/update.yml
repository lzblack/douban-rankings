name: Update rankings

on:
  schedule:
    - cron: '0 3 1 * *'  # 1st of each month, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # auto-commit data/
  issues: write     # read by the health-alert workflow downstream

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Cold-start Criterion resolution can hit Douban search for ~100-300
    # titles @ 5s/req; 240 min buffer covers that. Incremental monthly
    # runs finish in <10 min once data/movie.json has the resolved cache.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        # Reads `packageManager` from package.json for version pinning.

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run pipeline
        run: pnpm run update

      - name: Commit data
        run: |
          git config user.name "rankings-bot"
          git config user.email "bot@users.noreply.github.com"
          # In CI, snapshot-dependent sources report status=skipped (their
          # config/*-snapshot.json is gitignored and absent from the runner).
          # The pipeline carries their items forward from the previous
          # data/*.json, so only the live-scrape sources (IMDb, AFI) change
          # and the published data never shrinks to what CI could scrape.
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: scheduled update"
          git push
