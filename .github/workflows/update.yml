name: Update rankings

on:
  schedule:
    - cron: '0 3 1 * *'  # 1st of each month, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # auto-commit data/
  issues: write     # read by the health-alert workflow downstream

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Snapshot fetchers take ~45 min (TSPDT's 1000 Letterboxd pages are
    # most of it); the pipeline itself is <10 min once data/movie.json holds
    # the resolved cache. 240 min leaves room for a cold-start resolution.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        # Reads `packageManager` from package.json for version pinning.

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Restore manual mapping
        env:
          MANUAL_MAPPING_YAML: ${{ secrets.MANUAL_MAPPING_YAML }}
        run: |
          mkdir -p config
          if [ -n "$MANUAL_MAPPING_YAML" ]; then
            printf '%s\n' "$MANUAL_MAPPING_YAML" > config/manual-mapping.yaml
          else
            echo "::warning::MANUAL_MAPPING_YAML secret is not set; matching runs without manual overrides"
          fi

      # Snapshot fetchers. A fetcher that fails leaves its snapshot absent,
      # so the pipeline marks that source skipped and carries its published
      # items forward; health's snapshotMaxAgeDays alert fires if it keeps
      # failing. BFI / BBC / Rolling Stone are fixed one-off lists and are
      # never refetched.
      - name: Fetch Criterion snapshot
        continue-on-error: true
        run: pnpm run fetch:criterion-snapshot

      - name: Fetch Letterboxd Top 250 snapshot
        continue-on-error: true
        run: pnpm run fetch:letterboxd-top250-snapshot

      - name: Fetch Bangumi Top 250 snapshot
        continue-on-error: true
        run: pnpm run fetch:bangumi-top250-snapshot

      - name: Fetch Grammy AOTY snapshot
        continue-on-error: true
        run: pnpm run fetch:grammy-aoty-snapshot

      - name: Fetch TSPDT 1000 snapshot
        continue-on-error: true
        run: pnpm run fetch:tspdt-1000-snapshot

      - name: Run pipeline
        run: pnpm run update

      - name: Commit data
        run: |
          git config user.name "rankings-bot"
          git config user.email "bot@users.noreply.github.com"
          # config/ (snapshots, manual mapping) is gitignored, so only the
          # published output under data/ is committed.
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: scheduled update"
          git push
