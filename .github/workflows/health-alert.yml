name: Health alert

on:
  workflow_run:
    workflows: ['Update rankings']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ensure health-alert label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create health-alert \
            --description "Automated alert: scraper health" \
            --color "d73a4a" \
            --force

      - name: Open issues for failing or stale sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f data/health.json ]; then
            echo "No data/health.json yet — nothing to alert on."
            exit 0
          fi

          # One "<id> <kind>" line per alert: kind=failing when a source hit
          # the failure threshold, kind=stale when a snapshot source's
          # lastSuccessAt is past its snapshotMaxAgeDays.
          alerts=$(jq -r '
            .sources[]?
            | (select((.consecutiveFailures // 0) >= 3) | "\(.id) failing"),
              (select(.stale == true) | "\(.id) stale")
          ' data/health.json)

          if [ -z "$alerts" ]; then
            echo "All sources healthy."
            exit 0
          fi

          echo "$alerts" | while read -r id kind; do
            [ -z "$id" ] && continue
            if [ "$kind" = stale ]; then
              title="[health] ${id} snapshot is stale"
            else
              title="[health] ${id} failed 3+ runs in a row"
            fi

            # Dedupe: skip if an open issue with the exact title exists.
            existing=$(gh issue list \
              --label health-alert \
              --state open \
              --search "\"$title\" in:title" \
              --json title \
              --jq '.[] | .title' \
              | head -1)

            if [ -n "$existing" ]; then
              echo "Open issue already exists for $id ($kind), skipping."
              continue
            fi

            body=$(jq -r --arg id "$id" --arg kind "$kind" '
              .sources[]? | select(.id == $id)
              | if $kind == "stale" then
                  "Snapshot source `\($id)` last refreshed \(.lastSuccessAt // "never"), past its max age.\n\nRefresh from a residential IP: run its `pnpm run fetch:*-snapshot` script, then `pnpm run update` and push `data/`.\n\nSee `data/health.json` on `main` for the current report."
                else
                  "Source `\($id)` has failed \(.consecutiveFailures) runs in a row.\n\nLast success: \(.lastSuccessAt // "never")\nLast failure: \(.lastFailureAt // "unknown")\nLast message: \(.message // "(none)")\n\nSee `data/health.json` on `main` for the current report."
                end
            ' data/health.json)

            gh issue create \
              --title "$title" \
              --label health-alert \
              --body "$body"
            echo "Opened $kind issue for $id"
          done
